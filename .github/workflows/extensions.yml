name: Extension API checks

on:
  push:
    branches:
      - rebuild/extension-api
  pull_request:
    paths:
      - 'screens/vr.cpp'
      - 'justfile'
      - 'screens/extension-motion.h'
      - 'screens/stereo-preview.h'
      - 'screens/handcut.cpp'
      - 'screens/handtest.cpp'
      - 'screens/stereo-image.h'
      - 'screens/test/capture-stereo.py'
      - 'screens/tests/stereo-image-test.cpp'
      - 'screens/tests/test_capture_stereo.py'
      - 'screens/handcut.h'
      - 'screens/tests/extension-motion-test.cpp'
      - 'screens/tests/stereo-preview-test.cpp'
      - 'extensions/**'
      - 'docs/extensions.md'
      - 'docs/upgrade-from-upstream.md'
      - 'scripts/upgrade-from-upstream.sh'
      - 'scripts/tests/test-upgrade-from-upstream.sh'
      - '.github/workflows/extensions.yml'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Client protocol and syntax
        run: |
          python3 -m py_compile extensions/ft_ext.py
          python3 extensions/tests/test_ft_ext.py
      - name: Upstream-to-fork migration safety
        run: |
          bash -n scripts/upgrade-from-upstream.sh
          bash scripts/tests/test-upgrade-from-upstream.sh
      - name: Transition geometry
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror screens/tests/extension-motion-test.cpp -o /tmp/ft-ext-motion-test
          /tmp/ft-ext-motion-test
      - name: Stereo preview validation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror screens/tests/stereo-preview-test.cpp -o /tmp/ft-stereo-preview-test
          /tmp/ft-stereo-preview-test
      - name: Stereo image and snapshot capture parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror screens/tests/stereo-image-test.cpp -o /tmp/ft-stereo-image-test
          /tmp/ft-stereo-image-test
          python3 -m py_compile screens/test/capture-stereo.py
          python3 screens/tests/test_capture_stereo.py
