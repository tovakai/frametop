name: "One-time Hyprland upstream merge candidate"
on:
  push:
    branches:
      - sync/hyprland-v0.3.0-exp.19-candidate

permissions:
  contents: write

jobs:
  upstream-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the Hyprland candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Merge the exact upstream release and run offline smoke tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add frametop-upstream https://github.com/Frametop/frametop.git
          git fetch --no-tags frametop-upstream refs/tags/v0.3.0-exp.19
          TARGET="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$TARGET" = "ef97943247de10e840f9b6759cc5a330bc761082"
          echo "Upstream release commit: $TARGET"

          echo "::group::Try a normal three-way merge first"
          if git merge --no-ff --no-commit --no-edit "$TARGET" > /tmp/merge.log 2>&1; then
            echo "No textual conflicts"
          else
            cat /tmp/merge.log
            echo "Paths needing merge resolution:"
            git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
            git merge --abort
            echo "::group::Retry with fork-preferred conflict hunks"
            git merge --no-ff --no-commit --no-edit -X ours "$TARGET"
            echo "::endgroup::"
          fi
          echo "::endgroup::"

          if test -n "$(git ls-files -u)"; then
            echo "::error::Unresolved merge conflicts remain; refusing to commit or push."
            git status --short
            exit 1
          fi

          echo "::group::Offline branch smoke tests"
          FAILURE=0
          bash -n session/frametop-session.sh session/frametop-hyprland.sh session/hyprland-on-start.sh session/hyprland-doctor.sh session/hyprland-smoke.sh session/frametop-desktop.sh session/install-hyprland-desktop.sh session/plasma-stop.sh session/desktop-stop.sh session/hyprland-stop.sh || FAILURE=1
          python3 -m unittest discover -s session/tests -p 'test_hyprland*.py' -v || FAILURE=1
          python3 extensions/tests/test_ft_ext.py || FAILURE=1
          bash scripts/tests/test-upgrade-from-upstream.sh || FAILURE=1
          g++ -std=c++17 -Wall -Wextra -Werror screens/tests/extension-motion-test.cpp -o /tmp/ft-ext-motion-test && /tmp/ft-ext-motion-test || FAILURE=1
          echo "::endgroup::"

          git rm -- .github/workflows/sync-upstream-exp19-hyprland.yml
          git add -A
          git commit -m "Merge upstream Frametop v0.3.0-exp.19 into Hyprland session" -m "Preserve fork-specific hunks at overlapping conflicts. Candidate for review and device validation."
          git push origin HEAD:sync/hyprland-v0.3.0-exp.19-candidate
          if test "$FAILURE" -ne 0; then
            echo "::error::Candidate pushed, but offline tests failed. Do not promote it without fixes."
            exit 1
          fi
