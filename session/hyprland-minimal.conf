# Minimal first-boot config for Hyprland nested inside Frametop's ft-screens.
# This is deliberately NOT the laptop/end-4 profile. Prove rendering/input first.
# The first Aquamarine output is WAYLAND-1. Extra Wayland-backed outputs create
# separate host toplevels for Frametop's panels; never use headless outputs here.
monitor = , preferred, auto, 1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
}
decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# hyprctl runs inside Hyprland's child environment with its instance signature.
# Dynamic output-to-panel ID mapping is still a TODO: don't remove/re-add
# outputs expecting Frametop to preserve their index.
exec-once = sh -c 'n=${FT_SCREEN_COUNT:-1}; i=1; while [ "$i" -lt "$n" ]; do hyprctl output create wayland || exit 1; i=$((i+1)); done'
# Open a terminal when available; failing to find one should not kill the session.
exec-once = sh -c 'if command -v foot >/dev/null 2>&1; then foot; elif command -v kitty >/dev/null 2>&1; then kitty; fi'
bind = SUPER, Return, exec, foot
bind = SUPER SHIFT, E, exit,
